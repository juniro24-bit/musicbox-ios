name: Build IPA

# 저장소에 코드를 올리면 자동으로 돌고, Actions 탭에서 "Run workflow"로 직접 돌릴 수도 있어요.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 만들기
        run: xcodegen generate

      - name: 빌드 (서명 없이)
        run: |
          set -o pipefail
          xcodebuild \
            -project MusicBox.xcodeproj \
            -scheme MusicBox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: IPA 만들기
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MusicBox.app Payload/
          zip -qry MusicBox.ipa Payload
          ls -la MusicBox.ipa

      - name: IPA 올리기
        uses: actions/upload-artifact@v4
        with:
          name: MusicBox-ipa
          path: MusicBox.ipa
          retention-days: 30

      - name: 빌드 로그 올리기 (실패했을 때 이 파일을 보내 주세요)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
